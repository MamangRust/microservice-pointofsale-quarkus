# ── Seeder Orchestrator (clean runner) ─────────────────────────────
# No gRPC, no Hibernate, no Flyway, no HTTP — just CDI + reactive PG pool.

quarkus.application.name=seeder

# Database (reactive PG client only — no Hibernate, no Flyway)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:DRAGON}
quarkus.datasource.password=${DB_PASS:DRAGON}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:POINT_OF_SALE}

# Disable HTTP server
quarkus.http.port=-1

# Disable scheduler
quarkus.scheduler.enabled=false

# Exclude unnecessary CDI beans (from common module)
quarkus.arc.exclude-types=\
  com.sanedge.common.cache.RedisService,\
  com.sanedge.common.chaos.*,\
  com.sanedge.common.observability.*,\
  com.sanedge.common.exception.*,\
  com.sanedge.common.jwt.*

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG
