# ── Stats Backfill (one-shot job) ─────────────────────────────────
quarkus.application.name=stats-backfill

# Database (reactive PG client — reads from OLTP, writes to outbox)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:DRAGON}
quarkus.datasource.password=${DB_PASS:DRAGON}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:POINT_OF_SALE}

# Disable HTTP server (one-shot job)
quarkus.http.port=-1

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG
